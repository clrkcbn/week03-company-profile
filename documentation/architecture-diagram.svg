<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 900" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2f49b0"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="900" fill="#ffffff"/>

  <!-- Step boxes -->
  <g font-size="18" text-anchor="middle">
    <rect x="170" y="20" width="300" height="80" rx="14" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="320" y="55" fill="#101a35" font-weight="700">Client (Browser)</text>
    <text x="320" y="80" fill="#3b5bdb" font-size="13">User requests a URL, e.g. /about</text>

    <rect x="170" y="160" width="300" height="80" rx="14" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="320" y="195" fill="#101a35" font-weight="700">Route (routes/web.php)</text>
    <text x="320" y="220" fill="#3b5bdb" font-size="13">Matches the URL to a controller method</text>

    <rect x="170" y="300" width="300" height="80" rx="14" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="320" y="335" fill="#101a35" font-weight="700">CompanyController</text>
    <text x="320" y="360" fill="#3b5bdb" font-size="13">Prepares data, calls the Model if needed</text>

    <rect x="170" y="440" width="300" height="80" rx="14" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="320" y="475" fill="#101a35" font-weight="700">Blade View</text>
    <text x="320" y="500" fill="#3b5bdb" font-size="13">Renders HTML using layouts &amp; components</text>

    <rect x="170" y="580" width="300" height="80" rx="14" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="320" y="615" fill="#101a35" font-weight="700">HTTP Response</text>
    <text x="320" y="640" fill="#3b5bdb" font-size="13">Rendered HTML is sent back to the client</text>

    <rect x="170" y="720" width="300" height="80" rx="14" fill="#eef4ff" stroke="#3b5bdb" stroke-width="2"/>
    <text x="320" y="755" fill="#101a35" font-weight="700">Browser Renders Page</text>
    <text x="320" y="780" fill="#3b5bdb" font-size="13">User sees the final web page</text>
  </g>

  <!-- Arrows -->
  <g stroke="#2f49b0" stroke-width="2" marker-end="url(#arrow)">
    <line x1="320" y1="100" x2="320" y2="158"/>
    <line x1="320" y1="240" x2="320" y2="298"/>
    <line x1="320" y1="380" x2="320" y2="438"/>
    <line x1="320" y1="520" x2="320" y2="578"/>
    <line x1="320" y1="660" x2="320" y2="718"/>
  </g>
</svg>
